<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon-Group School System</title>

<style>
body{font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;margin:0;background:#f3f4f6;}
header{background:#1E3A8A;color:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:100;}
.container{display:flex;min-height: calc(100vh - 56px);}
.sidebar{width:220px;background:#1E3A8A;color:#fff;padding:10px;box-sizing:border-box;}
.sidebar button{width:100%;padding:10px;border:none;background:none;color:white;text-align:left;cursor:pointer;margin-bottom:5px;}
.sidebar button:hover{background:#10B981;}
.main{flex:1;padding:20px;box-sizing:border-box;overflow-y:auto;}
.card{background:white;padding:15px;border-radius:10px;margin-bottom:20px;box-shadow: 0 2px 8px rgb(0 0 0 / 0.1);}
.btn{background:#10B981;color:white;border:none;padding:8px 16px;border-radius:5px;cursor:pointer;font-size:1rem;}
.btn:disabled{background:#aaa;cursor:not-allowed;}
input, select, button.prompt-input{width:100%;padding:8px;margin:5px 0;border:1px solid #ddd;border-radius:4px;box-sizing:border-box;}
.logout-btn{background:#E11D48; margin-top: 10px;}
.flex-row {display:flex; gap: 10px; align-items:center; flex-wrap: wrap;}
</style>

</head>
<body>

<header>
  HORIZON-GROUP School Management System
  <button id="logoutBtn" class="btn logout-btn" style="display:none; float:right; margin-top:-34px; margin-right:10px;" onclick="logout()">Logout</button>
</header>

<div id="login" class="card" style="max-width:400px; margin:30px auto;">
  <h3>Select Role</h3>
  <button class="btn" onclick="login('admin')">Admin</button>
  <button class="btn" onclick="login('teacher')">Teacher</button>
  <button class="btn" onclick="parentLogin()">Parent</button>
</div>

<div id="app" style="display:none;">
  <div class="container">
    <div class="sidebar" id="menu"></div>

    <div class="main">
      <div id="content"></div>
    </div>
  </div>
</div>

<script>
// DATA
const students = [];
let currentUser = "";
let currentParentStudent = null;
let otp = "";

// SUBJECTS
const subjects = ["English","Chichewa","Primary Science","Agriculture","Social Studies","French","Expressive Arts","Life Skills","Bible Knowledge"];
const MAX_FEES = 100000;

// LOGIN
function login(role){
    currentUser = role;
    currentParentStudent = null;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('logoutBtn').style.display = 'inline-block';
    loadMenu();
}

function logout() {
    currentUser = "";
    currentParentStudent = null;
    otp = "";
    document.getElementById('login').style.display = 'block';
    document.getElementById('app').style.display = 'none';
    document.getElementById('logoutBtn').style.display = 'none';
    document.getElementById('menu').innerHTML = '';
    document.getElementById('content').innerHTML = '';
}

function parentLogin(){
    const name = prompt("Enter Student Name (case sensitive):");
    if(!name) return alert("Student Name is required.");
    const phone = prompt("Enter Phone Number:");
    if(!phone) return alert("Phone Number is required.");

    const studentMatch = students.find(s=>s.name === name);
    if(!studentMatch) return alert("Student not found.");

    otp = (Math.floor(1000 + Math.random()*9000)).toString();
    // For demo purpose we show OTP in prompt. In production, send via SMS or email.
    let enteredOtp = prompt(`Enter OTP sent to phone number.\n(For demo use: ${otp})`);
    if(enteredOtp === otp){
        currentUser = "parent";
        currentParentStudent = studentMatch;
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('logoutBtn').style.display = 'inline-block';
        loadMenu();
        loadParent(currentParentStudent);
    } else {
        alert("Incorrect OTP.");
    }
}

// MENU
function loadMenu(){
    const menu = document.getElementById('menu');
    if(currentUser === "admin"){
        menu.innerHTML=`
          <button onclick="adminDashboard()">Dashboard</button>
          <button onclick="studentPage()">Students</button>`;
        adminDashboard();
    }
    else if(currentUser === "teacher"){
        menu.innerHTML=`
          <button onclick="teacherPage()">Enter Results</button>`;
        teacherPage();
    }
    else if(currentUser === "parent"){
        menu.innerHTML=`
          <button onclick="loadParent(currentParentStudent)">Report Card</button>`;
    }
}

// ADMIN DASHBOARD
function adminDashboard(){
    let html = `<div class="card">
      <h2>Dashboard</h2>
      <p><b>Total Students:</b> ${students.length}</p>
    </div>`;
    document.getElementById('content').innerHTML = html;
}

// STUDENT MANAGEMENT
function studentPage(){
    let html = `<div class="card">
      <h2>Students</h2>
      <button class="btn" onclick="addStudent()">Add Student</button>
      <table><thead><tr>
          <th>Name</th><th>Class</th><th>Fees Balance</th><th>Action</th>
        </tr></thead><tbody>`;
    students.forEach((s,i)=>{
        html+=`<tr>
          <td>${s.name}</td>
          <td>${s.class}</td>
          <td>${MAX_FEES - s.paid}</td>
          <td><button class="btn" style="font-size:0.8rem" onclick="viewStudent(${i})">View</button></td>
        </tr>`;
    });
    html += `</tbody></table></div>`;
    document.getElementById('content').innerHTML = html;
}

function addStudent(){
    let name = prompt("Student Name:");
    if(!name || !name.trim()) return alert("Name is required.");
    name = name.trim();

    let cls = prompt("Class (Standard 1-8):");
    if(!cls || !cls.trim()) return alert("Class is required.");
    cls = cls.trim();
    if(!/^[1-8]$/.test(cls)) return alert("Class must be between 1 and 8.");

    // Prevent duplicate names (optional)
    if(students.find(s => s.name === name)){
        return alert("Student with this name already exists.");
    }

    students.push({name, class: cls, paid:0, marks:{}, history:[]});
    studentPage();
}

// VIEW STUDENT
function viewStudent(i){
    const s = students[i];
    let html = `<div class="card">
      <h2>${s.name}</h2>
      <p><b>Class:</b> ${s.class}</p>
      <p><b>Fees Paid:</b> ${s.paid}</p>
      <p><b>Balance:</b> ${MAX_FEES - s.paid}</p>
      <button class="btn" onclick="payFees(${i})">Pay Fees</button>
      <h3>Payment History</h3>`;
    if(s.history.length === 0){
        html += `<p>No payments made yet.</p>`;
    } else {
        s.history.forEach(h=>{
            html+= `<p>${h.amount.toLocaleString()} on ${h.date}</p>`;
        });
    }
    html += `</div>`;
    document.getElementById('content').innerHTML = html;
}

// FEES
function payFees(i){
    const s = students[i];
    let amtStr = prompt("Amount to Pay:");
    if(!amtStr) return alert("Amount is required.");
    let amt = Number(amtStr);
    if(isNaN(amt) || amt <=0) return alert("Please enter a valid positive amount.");
    if(s.paid + amt > MAX_FEES) return alert(`Payment exceeds fees balance (${MAX_FEES - s.paid}).`);

    const date = new Date().toLocaleDateString();
    s.paid += amt;
    s.history.push({amount: amt, date});
    viewStudent(i);
}

// TEACHER PAGE
function teacherPage(){
    let html = `<div class="card">
      <h2>Enter Results</h2>
      <label for="studentSelect">Select Student:</label>
      <select id="studentSelect">`;
    students.forEach((s,i)=>{
        html+=`<option value="${i}">${s.name}</option>`;
    });
    html+=`</select>`;

    html += `<div style="margin-top:10px;">`;
    subjects.forEach(sub=>{
        html+=`<label for="${sub}">${sub}:</label><input type="number" min="0" max="100" id="${sub}" placeholder="Marks out of 100"><br>`;
    });
    html+=`</div>`;

    html+=`<button class="btn" onclick="saveResults()" style="margin-top:10px;">Save</button></div>`;
    document.getElementById('content').innerHTML = html;

    // Clear inputs on load
    subjects.forEach(sub=>document.getElementById(sub).value = "");
}

function grade(m){
    if(m >= 80) return "A";
    if(m >= 70) return "B";
    if(m >= 60) return "C";
    if(m >= 50) return "D";
    return "F";
}

function saveResults(){
    let i = document.getElementById("studentSelect").value;
    if(i === "") return alert("Select a student.");
    let total = 0;
    let invalidInput = false;

    subjects.forEach(sub=>{
        let input = document.getElementById(sub);
        let m = Number(input.value);
        if(isNaN(m) || m < 0 || m > 100){
            invalidInput = true;
            input.style.borderColor = "red";
        } else {
            input.style.borderColor = "#ddd";
            students[i].marks[sub] = m;
            total += m;
        }
    });

    if(invalidInput){
        return alert("Please enter valid marks (0-100) for all subjects.");
    }

    students[i].avg = (total/subjects.length).toFixed(1);
    students[i].grade = grade(students[i].avg);

    alert("Results Saved!");
}

// PARENT VIEW
function loadParent(student){
    if(!student) {
        document.getElementById('content').innerHTML = `<div class="card"><p>Student data not loaded.</p></div>`;
        return;
    }

    let html = `<div class="card">
      <h2>${student.name} Report Card</h2>
      <table><thead><tr><th>Subject</th><th>Marks</th></tr></thead><tbody>`;

    subjects.forEach(sub=>{
        html+=`<tr><td>${sub}</td><td>${(typeof student.marks[sub] === "number") ? student.marks[sub] : '-'}</td></tr>`;
    });

    html+=`</tbody></table>
      <p><b>Average:</b> ${student.avg || '-'}</p>
      <p><b>Grade:</b> ${student.grade || '-'}</p>
      <p><b>Fees Balance:</b> ${MAX_FEES - student.paid}</p>
      </div>`;

    document.getElementById('content').innerHTML = html;
}

</script>

</body>
</html>
